name: peaklogic-cloud
region: nyc

services:
  - name: api
    github:
      repo: PeakLogicSystems/PeakLogic-DigitalOcean
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm ci --omit=dev
    run_command: npm start
    http_port: 3100
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3100"
      - key: PEAKLOGIC_DEPLOYMENT
        value: cloud
      - key: MONGODB_URI
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: PLATFORM_ADMIN_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MONGODB_DB
        value: peaklogic_cloud
