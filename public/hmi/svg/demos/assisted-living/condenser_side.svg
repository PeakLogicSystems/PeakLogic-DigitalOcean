<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 640" width="280" height="640">
  <defs>
    <linearGradient id="condenser_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="280" height="640" fill="url(#condenser_sky)"/>
  <text id="lbl_cond_title" x="140" y="36" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#0f172a">Roof Condenser</text>
  <text id="lbl_cond_floor" x="140" y="58" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#64748b">Floor shared unit</text>
  <!-- Rooftop pad -->
  <rect x="20" y="72" width="240" height="120" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <text x="140" y="98" text-anchor="middle" font-size="11" fill="#475569">Roof curb / pad</text>
  <!-- Condenser cabinet -->
  <rect x="40" y="110" width="200" height="160" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <circle cx="80" cy="190" r="42" fill="none" stroke="#64748b" stroke-width="3"/>
  <circle cx="80" cy="190" r="6" fill="#64748b"/>
  <line x1="80" y1="148" x2="80" y2="168" stroke="#64748b" stroke-width="3"/>
  <line x1="80" y1="212" x2="80" y2="232" stroke="#64748b" stroke-width="3"/>
  <line x1="38" y1="190" x2="58" y2="190" stroke="#64748b" stroke-width="3"/>
  <line x1="102" y1="190" x2="122" y2="190" stroke="#64748b" stroke-width="3"/>
  <rect x="130" y="130" width="90" height="120" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="175" y="152" text-anchor="middle" font-size="10" fill="#475569">Compressor</text>
  <rect x="145" y="165" width="60" height="70" rx="3" fill="#94a3b8" stroke="#334155"/>
  <!-- Status lamps -->
  <text x="28" y="310" font-size="12" fill="#334155">Fan failure</text>
  <circle id="lamp_cond_fan" cx="240" cy="306" r="10" fill="#64748b"/>
  <text x="28" y="345" font-size="12" fill="#334155">Compressor failure</text>
  <circle id="lamp_cond_comp" cx="240" cy="341" r="10" fill="#64748b"/>
  <!-- Temps -->
  <rect x="20" y="370" width="240" height="120" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="140" y="395" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Refrigerant temps</text>
  <text x="36" y="430" font-size="12" fill="#334155">Hi side �F</text>
  <text id="val_cond_hi" x="220" y="430" text-anchor="end" font-family="Consolas,monospace" font-size="18" fill="#0f172a"></text>
  <text x="36" y="465" font-size="12" fill="#334155">Lo side �F</text>
  <text id="val_cond_lo" x="220" y="465" text-anchor="end" font-family="Consolas,monospace" font-size="18" fill="#0f172a"></text>
  <!-- Alarm strip -->
  <rect x="20" y="510" width="240" height="44" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <circle id="lamp_cond_alm" cx="44" cy="532" r="10" fill="#64748b"/>
  <text x="62" y="537" font-size="12" fill="#991b1b">Condenser alarm</text>
  <text x="140" y="580" text-anchor="middle" font-size="10" fill="#94a3b8">Side graphic � per-floor rooftop A/C</text>
</svg>
