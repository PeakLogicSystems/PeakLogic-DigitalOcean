    <text x="512" y="684" text-anchor="middle" font-size="11" fill="#64748b">Heater kW</text>
    <text id="val_wh3_kw" x="814" y="660" text-anchor="middle" font-family="Consolas,monospace" font-size="20" fill="#0f172a">— kW</text>
