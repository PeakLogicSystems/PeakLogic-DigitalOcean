<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="480" fill="#f1f5f9"/>
  <text x="24" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">PeakLogic HMI  demo process</text>
  <text x="24" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Bind DI1 / Q1 (Waveshare) or your tags in HMI setup. Import Opto 22 SVGs into public/hmi/svg/</text>

  <!-- Tank -->
  <g id="tank1" filter="url(#shadow)">
    <rect x="120" y="120" width="140" height="220" rx="8" fill="url(#tankGrad)" stroke="#475569" stroke-width="3"/>
    <rect x="135" y="200" width="110" height="120" rx="4" fill="#3b82f6" opacity="0.35"/>
    <text x="190" y="365" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#334155">Tank</text>
  </g>

  <!-- Pump / motor -->
  <g id="pump1" class="hmi-motor-stop" transform="translate(380, 200)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="48" fill="#64748b" stroke="#334155" stroke-width="3"/>
    <rect x="-28" y="-12" width="56" height="24" rx="4" fill="#1e293b" opacity="0.15"/>
    <text x="0" y="72" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#334155">Pump (Q1)</text>
  </g>

  <!-- Valve -->
  <g id="valve1" transform="translate(300, 230)" filter="url(#shadow)">
    <polygon points="0,-30 26,0 0,30 -26,0" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <rect x="-4" y="-36" width="8" height="72" fill="#64748b"/>
    <text x="0" y="52" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#334155">Valve (DI1)</text>
  </g>

  <!-- Piping -->
  <path d="M 260 230 L 332 230" stroke="#475569" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 428 230 L 520 230 L 520 180 L 620 180" stroke="#475569" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- DI indicator lamp -->
  <g id="led_di1" transform="translate(640, 140)" style="display:none">
    <circle cx="0" cy="0" r="22" fill="#22c55e" stroke="#166534" stroke-width="2"/>
    <text x="0" y="44" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#334155">DI1 active</text>
  </g>

  <!-- Status labels (text bindings) -->
  <text id="label_di1" x="640" y="220" font-family="Segoe UI, Arial" font-size="16" fill="#0f172a">DI1 OFF</text>
  <text id="label_q1" x="380" y="300" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="600" fill="#0f172a">Pump STOP</text>

  <!-- Touch-style write hint -->
  <rect id="btn_q1_hint" x="520" y="320" width="240" height="56" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="640" y="352" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" fill="#64748b">Use Force tab to toggle Q1</text>
</svg>
