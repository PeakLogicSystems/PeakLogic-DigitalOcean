<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns="http://www.w3.org/2000/svg"
   version="1.0"
   width="50"
   height="50">

<defs>

	<!-- Colour Gradients. -->
	<linearGradient id="MB_OliveGradient" x1="1" y1="1" x2="0" y2="0">
		<stop offset="50%" stop-color="olive" />
		<stop offset="100%" stop-color="white" />
	</linearGradient>

</defs>

<!-- This provides a triangular button pointing down. -->
<g fill="url(#MB_OliveGradient)" stroke="black"
	>

	<!-- This provides the relief. -->
 	<polygon points="2,2 7,0 45,0 42,2 2,2"/>
	<polygon points="45,0 42,2 22,42 24,41 45,0"/>

	<!-- This is the button. -->
	<polygon points="2,2 22,42 42,2 2,2"/>

</g>

</svg>

