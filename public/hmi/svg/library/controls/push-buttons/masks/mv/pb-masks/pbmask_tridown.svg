<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns="http://www.w3.org/2000/svg"
   version="1.0"
   width="60"
   height="60">

<defs>
	<!-- The following filter is used to add a drop shadown. -->
	<filter id="MB_DropShadowFilter">
		<feGaussianBlur stdDeviation="2">
		</feGaussianBlur>
	</filter>
</defs>

<!-- Triangular push button (down).  60 x 60 px. -->
<g
	>

	<polygon fill="grey" opacity=".75" filter="url(#MB_DropShadowFilter)"  points="0,0 30,60 60,0 0,0"/>

</g>

</svg>
