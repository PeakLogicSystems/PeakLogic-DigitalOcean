<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 620" width="1150" height="620" style="background-color: #1a1a1a; font-family: sans-serif; color: #ffffff;">
  <style>
    .title { font-size: 18px; font-weight: bold; fill: #ffffff; }
    .subtitle { font-size: 14px; fill: #a0a0a0; font-weight: bold; }
    .label { font-size: 12px; fill: #dddddd; }
    .value { font-size: 14px; font-weight: bold; fill: #00ff00; font-family: monospace; }
    .btn-text { font-size: 12px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
    .indicator-text { font-size: 11px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; font-weight: bold; }
    .panel-bg { fill: #2a2a2a; stroke: #444444; stroke-width: 2; rx: 5; }
    .nested-panel { fill: #222222; stroke: #333333; stroke-width: 1; rx: 4; }
  </style>

  <!-- ==================== HEADER ==================== -->
  <rect x="15" y="15" width="870" height="60" class="panel-bg" />
  <text x="35" y="50" class="title">DUPLEXLS</text>

  <!-- ==================== WET WELL & FLOATS ==================== -->
  <rect x="15" y="90" width="180" height="515" class="panel-bg" />
  <text x="30" y="115" class="subtitle">WET WELL LEVEL</text>

  <rect id="wet_well_vessel" x="35" y="140" width="40" height="435" fill="#111" stroke="#555" stroke-width="2" rx="2" />
  <rect id="wet_well_fill" x="37" y="380" width="36" height="193" fill="#0055aa" opacity="0.7" />
  <text id="val_tank_level" x="55" y="130" class="value" text-anchor="middle">42.0%</text>

  <g transform="translate(90, 160)">
    <circle id="lamp_float_high" cx="12" cy="0" r="10" fill="#333" stroke="#ff3333" stroke-width="2" />
    <line x1="-15" y1="0" x2="2" y2="0" stroke="#ff3333" stroke-width="2" />
    <text x="30" y="4" class="label">HIGH FLOOD</text>
  </g>
  <g transform="translate(90, 260)">
    <circle id="lamp_float_lag" cx="12" cy="0" r="10" fill="#333" stroke="#ffaa00" stroke-width="2" />
    <line x1="-15" y1="0" x2="2" y2="0" stroke="#ffaa00" stroke-width="2" />
    <text x="30" y="4" class="label">LAG START</text>
  </g>
  <g transform="translate(90, 360)">
    <circle id="lamp_float_lead" cx="12" cy="0" r="10" fill="#00ff00" stroke="#00ff00" stroke-width="2" />
    <line x1="-15" y1="0" x2="2" y2="0" stroke="#00ff00" stroke-width="2" />
    <text x="30" y="4" class="label">LEAD START</text>
  </g>
  <g transform="translate(90, 480)">
    <circle id="lamp_float_off" cx="12" cy="0" r="10" fill="#00ff00" stroke="#00ff00" stroke-width="2" />
    <line x1="-15" y1="0" x2="2" y2="0" stroke="#00ff00" stroke-width="2" />
    <text x="30" y="4" class="label">PUMPS OFF</text>
  </g>

  <!-- ==================== PUMP MOTOR 1 ==================== -->
  <rect x="210" y="90" width="220" height="515" class="panel-bg" />
  <text x="225" y="115" class="subtitle">PUMP MOTOR 1</text>

  <rect id="ind_p1_running" x="225" y="135" width="55" height="22" rx="3" fill="#006600" />
  <text id="txt_p1_running" x="252" y="146" class="indicator-text">RUNNING</text>
  <rect id="ind_p1_stopped" x="290" y="135" width="50" height="22" rx="3" fill="#222" stroke="#444" />
  <text id="txt_p1_stopped" x="315" y="146" class="indicator-text" style="fill:#555;">STOPPED</text>

  <rect x="225" y="175" width="190" height="75" class="nested-panel" />
  <text x="235" y="193" class="label" style="font-weight:bold; fill:#aaa;">HOA FUNCTION</text>
  <rect id="btn_p1_hand" x="235" y="205" width="50" height="32" rx="4" fill="#333" stroke="#555" />
  <text x="260" y="221" class="btn-text" style="fill:#aaa;">HAND</text>
  <rect id="btn_p1_off" x="295" y="205" width="50" height="32" rx="4" fill="#333" stroke="#555" />
  <text x="320" y="221" class="btn-text" style="fill:#aaa;">OFF</text>
  <rect id="btn_p1_auto" x="355" y="205" width="50" height="32" rx="4" fill="#0044aa" stroke="#00aaff" stroke-width="1.5" />
  <text x="380" y="221" class="btn-text">AUTO</text>

  <rect x="225" y="265" width="190" height="105" class="nested-panel" />
  <text x="235" y="283" class="label" style="font-weight:bold; fill:#aaa;">MANUAL OVERRIDE (HAND)</text>
  <rect id="btn_p1_start" x="235" y="295" width="170" height="30" rx="4" fill="#222" stroke="#00aa00" />
  <text x="320" y="310" class="btn-text" style="fill:#00ff00;">PUMP 1 START</text>
  <rect id="btn_p1_stop" x="235" y="332" width="170" height="30" rx="4" fill="#222" stroke="#aa0000" />
  <text x="320" y="347" class="btn-text" style="fill:#ff3333;">PUMP 1 STOP</text>

  <rect x="225" y="385" width="190" height="205" class="nested-panel" />
  <text x="235" y="405" class="label">NUMBER OF STARTS</text>
  <rect x="235" y="415" width="170" height="28" fill="#000" rx="3" stroke="#333" />
  <text id="val_p1_starts" x="395" y="434" class="value" text-anchor="end">0</text>
  <text x="235" y="465" class="label">ELAPSED TIME METER</text>
  <rect x="235" y="475" width="170" height="28" fill="#000" rx="3" stroke="#333" />
  <text id="val_p1_hrs" x="395" y="494" class="value" text-anchor="end">00000.0 HRS</text>

  <!-- ==================== PUMP MOTOR 2 ==================== -->
  <rect x="445" y="90" width="220" height="515" class="panel-bg" />
  <text x="460" y="115" class="subtitle">PUMP MOTOR 2</text>

  <rect id="ind_p2_running" x="460" y="135" width="55" height="22" rx="3" fill="#222" stroke="#444" />
  <text id="txt_p2_running" x="487" y="146" class="indicator-text" style="fill:#555;">RUNNING</text>
  <rect id="ind_p2_stopped" x="525" y="135" width="50" height="22" rx="3" fill="#cc0000" />
  <text id="txt_p2_stopped" x="550" y="146" class="indicator-text">STOPPED</text>

  <rect x="460" y="175" width="190" height="75" class="nested-panel" />
  <text x="470" y="193" class="label" style="font-weight:bold; fill:#aaa;">HOA FUNCTION</text>
  <rect id="btn_p2_hand" x="470" y="205" width="50" height="32" rx="4" fill="#333" stroke="#555" />
  <text x="495" y="221" class="btn-text" style="fill:#aaa;">HAND</text>
  <rect id="btn_p2_off" x="530" y="205" width="50" height="32" rx="4" fill="#333" stroke="#555" />
  <text x="555" y="221" class="btn-text" style="fill:#aaa;">OFF</text>
  <rect id="btn_p2_auto" x="590" y="205" width="50" height="32" rx="4" fill="#0044aa" stroke="#00aaff" stroke-width="1.5" />
  <text x="615" y="221" class="btn-text">AUTO</text>

  <rect x="460" y="265" width="190" height="105" class="nested-panel" />
  <text x="470" y="283" class="label" style="font-weight:bold; fill:#aaa;">MANUAL OVERRIDE (HAND)</text>
  <rect id="btn_p2_start" x="470" y="295" width="170" height="30" rx="4" fill="#222" stroke="#00aa00" />
  <text x="555" y="310" class="btn-text" style="fill:#00ff00;">PUMP 2 START</text>
  <rect id="btn_p2_stop" x="470" y="332" width="170" height="30" rx="4" fill="#222" stroke="#aa0000" />
  <text x="555" y="347" class="btn-text" style="fill:#ff3333;">PUMP 2 STOP</text>

  <rect x="460" y="385" width="190" height="205" class="nested-panel" />
  <text x="470" y="405" class="label">NUMBER OF STARTS</text>
  <rect x="470" y="415" width="170" height="28" fill="#000" rx="3" stroke="#333" />
  <text id="val_p2_starts" x="630" y="434" class="value" text-anchor="end">0</text>
  <text x="470" y="465" class="label">ELAPSED TIME METER</text>
  <rect x="470" y="475" width="170" height="28" fill="#000" rx="3" stroke="#333" />
  <text id="val_p2_hrs" x="630" y="494" class="value" text-anchor="end">00000.0 HRS</text>

  <!-- ==================== STATION & STATUS ==================== -->
  <rect x="680" y="90" width="205" height="515" class="panel-bg" />
  <text x="695" y="115" class="subtitle">STATION &amp; STATUS</text>

  <g transform="translate(695, 145)">
    <circle id="lamp_status" cx="20" cy="20" r="14" fill="#64748b" stroke="#444" stroke-width="2" />
    <text x="55" y="24" class="label" style="font-weight:bold;">STATUS</text>
    <text id="txt_station_status" x="55" y="38" class="label">OFFLINE</text>
  </g>
  <g transform="translate(695, 215)">
    <circle id="lamp_phase_fault" cx="20" cy="20" r="14" fill="#222" stroke="#444" stroke-width="2" />
    <text x="55" y="24" class="label" style="font-weight:bold;">PHASE FAULT</text>
  </g>
  <g transform="translate(695, 285)">
    <circle id="lamp_gen_run" cx="20" cy="20" r="14" fill="#222" stroke="#444" stroke-width="2" />
    <text x="55" y="24" class="label" style="font-weight:bold;">GEN RUN</text>
  </g>
  <g transform="translate(695, 355)">
    <circle id="lamp_gen_fuel" cx="20" cy="20" r="14" fill="#222" stroke="#444" stroke-width="2" />
    <text x="55" y="24" class="label" style="font-weight:bold;">GEN FUEL FAULT</text>
  </g>
  <g transform="translate(695, 425)">
    <circle id="lamp_gen_fault" cx="20" cy="20" r="14" fill="#222" stroke="#444" stroke-width="2" />
    <text x="55" y="24" class="label" style="font-weight:bold;">GEN FAULT</text>
  </g>
  <g transform="translate(695, 495)">
    <rect id="btn_alt_off" x="0" y="6" width="170" height="36" rx="4" fill="#333" stroke="#aa0000" />
    <circle id="lamp_alt_off" cx="20" cy="24" r="10" fill="#222" stroke="#aa0000" stroke-width="2" />
    <text x="42" y="28" class="label" style="font-weight:bold; pointer-events:none;">ALT OFF</text>
  </g>
</svg>
