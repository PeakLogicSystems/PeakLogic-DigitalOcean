<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="320" height="300">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="308" height="288" rx="10" fill="url(#panelGrad)" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">BACKWASH</text>
  <text x="160" y="44" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">Sequence - Timers - Manual start</text>

  <!-- Step indicator -->
  <g transform="translate(16, 56)">
    <rect x="0" y="0" width="288" height="100" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <g id="bw_step_lamp" transform="translate(40, 50)">
      <circle cx="0" cy="0" r="22" fill="#64748b" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="0" r="17" fill="#64748b" opacity="0.4"/>
    </g>
    <text id="bw_state" x="40" y="88" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="700" fill="#334155">IDLE</text>

    <text x="120" y="28" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#94a3b8">1 Idle</text>
    <text x="168" y="28" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#94a3b8">2 BW</text>
    <text x="216" y="28" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#94a3b8">3 Rinse</text>
    <text x="264" y="28" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" fill="#94a3b8">4 Return</text>
    <line x1="132" y1="50" x2="156" y2="50" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="180" y1="50" x2="204" y2="50" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="228" y1="50" x2="252" y2="50" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="120" cy="50" r="6" fill="#e2e8f0" stroke="#94a3b8"/>
    <circle cx="168" cy="50" r="6" fill="#e2e8f0" stroke="#94a3b8"/>
    <circle cx="216" cy="50" r="6" fill="#e2e8f0" stroke="#94a3b8"/>
    <circle cx="264" cy="50" r="6" fill="#e2e8f0" stroke="#94a3b8"/>
  </g>

  <!-- Busy + timer + done -->
  <g transform="translate(16, 166)">
    <rect x="0" y="0" width="288" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="48" y="18" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#64748b">BUSY</text>
    <g id="bw_busy_lamp" transform="translate(48, 36)">
      <circle cx="0" cy="0" r="12" fill="#64748b" stroke="#334155" stroke-width="2"/>
    </g>
    <text x="144" y="18" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#64748b">PHASE ms</text>
    <text id="bw_timer" x="144" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#0f172a">0</text>
    <text x="240" y="18" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#64748b">DONE</text>
    <g id="bw_done_lamp" transform="translate(240, 36)">
      <circle cx="0" cy="0" r="12" fill="#64748b" stroke="#334155" stroke-width="2"/>
    </g>
  </g>

  <!-- Mode + start -->
  <g transform="translate(16, 232)">
    <rect x="0" y="0" width="288" height="56" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="72" y="18" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#64748b">MODE</text>
    <g id="btn_bw_normal" transform="translate(24, 24)">
      <rect width="72" height="22" rx="11" fill="#64748b"/>
      <text x="36" y="15" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="700" fill="#ffffff">NORMAL</text>
    </g>
    <g id="btn_bw_backwash" transform="translate(108, 24)">
      <rect width="72" height="22" rx="11" fill="#cbd5e1"/>
      <text x="36" y="15" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="700" fill="#475569">BACKWASH</text>
    </g>

    <g id="btn_bw_start" transform="translate(216, 18)">
      <rect width="56" height="36" rx="6" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
      <text x="28" y="22" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="700" fill="#ffffff">START</text>
    </g>
  </g>
</svg>
