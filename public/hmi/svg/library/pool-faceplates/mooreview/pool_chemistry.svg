<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="320" height="280">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="308" height="268" rx="10" fill="url(#panelGrad)" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">POOL CHEMISTRY</text>
  <text x="160" y="44" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">pH - ORP - Salt - Dosing</text>

  <!-- Flow permissive -->
  <text x="40" y="66" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#334155">FLOW</text>
  <g id="flow_lamp" transform="translate(40, 82)">
    <circle cx="0" cy="0" r="12" fill="#ef4444" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#ef4444" opacity="0.45"/>
  </g>
  <text x="40" y="108" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="600" fill="#64748b">GPM</text>
  <text id="flow_gpm" x="40" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#0f172a">0.0</text>

  <!-- PV row -->
  <g transform="translate(72, 58)">
    <rect x="0" y="0" width="232" height="68" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="40" y="16" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#64748b">pH</text>
    <text id="ph_pv" x="40" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#0f172a">7.4</text>

    <text x="116" y="16" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#64748b">CL2 ppm</text>
    <text id="orp_pv" x="116" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#0f172a">2.0</text>

    <text x="192" y="16" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#64748b">SALT ppm</text>
    <text id="cond_pv" x="192" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#0f172a">3200</text>
  </g>

  <!-- CL2 setpoint + A/M -->
  <g transform="translate(16, 138)">
    <rect x="0" y="0" width="288" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="72" y="18" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="600" fill="#64748b">CL2 SP (ppm)</text>
    <g id="orp_sp_value">
      <rect x="36" y="24" width="72" height="24" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <text x="72" y="42" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#0f172a">2.0</text>
    </g>
    <text x="200" y="18" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="600" fill="#64748b">CL2 FEED</text>
    <g id="btn_cl2_auto" transform="translate(152, 22)">
      <rect width="56" height="20" rx="10" fill="#64748b"/>
      <text x="28" y="14" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="700" fill="#ffffff">AUTO</text>
    </g>
    <g id="btn_cl2_manual" transform="translate(216, 22)">
      <rect width="56" height="20" rx="10" fill="#cbd5e1"/>
      <text x="28" y="14" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="700" fill="#475569">MAN</text>
    </g>
  </g>

  <!-- pH + Cond A/M -->
  <g transform="translate(16, 204)">
    <rect x="0" y="0" width="288" height="64" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="72" y="18" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="600" fill="#64748b">pH CONTROL</text>
    <g id="btn_ph_auto" transform="translate(24, 28)">
      <rect width="48" height="20" rx="10" fill="#64748b"/>
      <text x="24" y="14" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#ffffff">AUTO</text>
    </g>
    <g id="btn_ph_manual" transform="translate(76, 28)">
      <rect width="48" height="20" rx="10" fill="#cbd5e1"/>
      <text x="24" y="14" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#475569">MAN</text>
    </g>

    <text x="216" y="18" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="600" fill="#64748b">SALT CONTROL</text>
    <g id="btn_cond_auto" transform="translate(168, 28)">
      <rect width="48" height="20" rx="10" fill="#64748b"/>
      <text x="24" y="14" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#ffffff">AUTO</text>
    </g>
    <g id="btn_cond_manual" transform="translate(220, 28)">
      <rect width="48" height="20" rx="10" fill="#cbd5e1"/>
      <text x="24" y="14" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#475569">MAN</text>
    </g>
  </g>
</svg>
