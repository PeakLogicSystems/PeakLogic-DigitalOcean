<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="320" height="460">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="308" height="448" rx="10" fill="url(#panelGrad)" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">POOL LIGHTING</text>
  <text x="160" y="44" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">6 zones - color pulse - operation drum</text>

  <!-- Operation drum -->
  <g transform="translate(16, 56)">
    <rect x="0" y="0" width="288" height="56" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="72" y="16" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#64748b">OPERATION</text>
    <g id="light_op_bezel" transform="translate(16, 22)">
      <rect width="112" height="28" rx="6" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
      <rect x="3" y="3" width="106" height="22" rx="4" fill="#f8fafc"/>
    </g>
    <text id="light_op_drum" x="72" y="42" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#0f172a">OFF</text>

    <text x="200" y="16" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#64748b">STATUS</text>
    <g id="light_perm_lamp" transform="translate(200, 34)">
      <circle cx="0" cy="0" r="12" fill="#64748b" stroke="#334155" stroke-width="2"/>
    </g>
    <text x="248" y="16" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#64748b">HRS</text>
    <text id="light_hrs" x="248" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#0f172a">0.0</text>
  </g>

  <!-- Enable / schedule / offline -->
  <g transform="translate(16, 120)">
    <rect x="0" y="0" width="288" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <g id="btn_light_en" transform="translate(12, 10)">
      <rect width="72" height="20" rx="10" fill="#22c55e"/>
      <text x="36" y="14" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="700" fill="#ffffff">ENABLE</text>
    </g>
    <g id="btn_light_sched" transform="translate(96, 10)">
      <rect width="72" height="20" rx="10" fill="#22c55e"/>
      <text x="36" y="14" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="700" fill="#ffffff">SCHED</text>
    </g>
    <g id="btn_light_offline" transform="translate(192, 10)">
      <rect width="84" height="20" rx="10" fill="#22c55e"/>
      <text id="btn_light_offline_label" x="42" y="14" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="700" fill="#ffffff">ONLINE</text>
    </g>
  </g>

  <!-- Pulse params -->
  <g transform="translate(16, 168)">
    <rect x="0" y="0" width="288" height="36" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="72" y="14" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#64748b">PULSE ms</text>
    <text id="light_pulse_ms" x="72" y="30" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#0f172a">1500</text>
    <text x="216" y="14" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#64748b">GAP ms</text>
    <text id="light_gap_ms" x="216" y="30" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#0f172a">500</text>
  </g>

  <!-- Zone grid header -->
  <text x="28" y="220" font-family="Segoe UI, Arial" font-size="8" font-weight="600" fill="#64748b">Z</text>
  <text x="52" y="220" font-family="Segoe UI, Arial" font-size="8" font-weight="600" fill="#64748b">EN</text>
  <text x="88" y="220" font-family="Segoe UI, Arial" font-size="8" font-weight="600" fill="#64748b">SET</text>
  <text x="136" y="220" font-family="Segoe UI, Arial" font-size="8" font-weight="600" fill="#64748b">ACT</text>
  <text x="184" y="220" font-family="Segoe UI, Arial" font-size="8" font-weight="600" fill="#64748b">RELAY</text>
  <text x="248" y="220" font-family="Segoe UI, Arial" font-size="8" font-weight="600" fill="#64748b">APPLY</text>

  <!-- Zone 1 -->
  <g transform="translate(16, 228)">
    <text x="12" y="14" font-family="Segoe UI, Arial" font-size="10" font-weight="700" fill="#334155">1</text>
    <g id="btn_z1_en" transform="translate(36, 0)"><rect width="28" height="16" rx="8" fill="#22c55e"/><text x="14" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">ON</text></g>
    <g id="light_z1_color_drum" transform="translate(72, 0)"><rect width="40" height="16" rx="4" fill="#94a3b8"/><text x="20" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">1</text></g>
    <g id="light_z1_sta_lamp" transform="translate(120, 0)"><circle cx="8" cy="8" r="8" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/></g>
    <g id="light_z1_relay" transform="translate(168, 0)"><circle cx="8" cy="8" r="8" fill="#64748b" stroke="#334155" stroke-width="1.5"/></g>
    <g id="btn_apply_z1" transform="translate(224, 0)"><rect width="48" height="16" rx="4" fill="#2563eb"/><text x="24" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">GO</text></g>
  </g>
  <!-- Zone 2 -->
  <g transform="translate(16, 252)">
    <text x="12" y="14" font-family="Segoe UI, Arial" font-size="10" font-weight="700" fill="#334155">2</text>
    <g id="btn_z2_en" transform="translate(36, 0)"><rect width="28" height="16" rx="8" fill="#22c55e"/><text x="14" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">ON</text></g>
    <g id="light_z2_color_drum" transform="translate(72, 0)"><rect width="40" height="16" rx="4" fill="#94a3b8"/><text x="20" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">1</text></g>
    <g id="light_z2_sta_lamp" transform="translate(120, 0)"><circle cx="8" cy="8" r="8" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/></g>
    <g id="light_z2_relay" transform="translate(168, 0)"><circle cx="8" cy="8" r="8" fill="#64748b" stroke="#334155" stroke-width="1.5"/></g>
    <g id="btn_apply_z2" transform="translate(224, 0)"><rect width="48" height="16" rx="4" fill="#2563eb"/><text x="24" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">GO</text></g>
  </g>
  <!-- Zone 3 -->
  <g transform="translate(16, 276)">
    <text x="12" y="14" font-family="Segoe UI, Arial" font-size="10" font-weight="700" fill="#334155">3</text>
    <g id="btn_z3_en" transform="translate(36, 0)"><rect width="28" height="16" rx="8" fill="#22c55e"/><text x="14" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">ON</text></g>
    <g id="light_z3_color_drum" transform="translate(72, 0)"><rect width="40" height="16" rx="4" fill="#94a3b8"/><text x="20" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">1</text></g>
    <g id="light_z3_sta_lamp" transform="translate(120, 0)"><circle cx="8" cy="8" r="8" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/></g>
    <g id="light_z3_relay" transform="translate(168, 0)"><circle cx="8" cy="8" r="8" fill="#64748b" stroke="#334155" stroke-width="1.5"/></g>
    <g id="btn_apply_z3" transform="translate(224, 0)"><rect width="48" height="16" rx="4" fill="#2563eb"/><text x="24" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">GO</text></g>
  </g>
  <!-- Zone 4 -->
  <g transform="translate(16, 300)">
    <text x="12" y="14" font-family="Segoe UI, Arial" font-size="10" font-weight="700" fill="#334155">4</text>
    <g id="btn_z4_en" transform="translate(36, 0)"><rect width="28" height="16" rx="8" fill="#22c55e"/><text x="14" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">ON</text></g>
    <g id="light_z4_color_drum" transform="translate(72, 0)"><rect width="40" height="16" rx="4" fill="#94a3b8"/><text x="20" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">1</text></g>
    <g id="light_z4_sta_lamp" transform="translate(120, 0)"><circle cx="8" cy="8" r="8" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/></g>
    <g id="light_z4_relay" transform="translate(168, 0)"><circle cx="8" cy="8" r="8" fill="#64748b" stroke="#334155" stroke-width="1.5"/></g>
    <g id="btn_apply_z4" transform="translate(224, 0)"><rect width="48" height="16" rx="4" fill="#2563eb"/><text x="24" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">GO</text></g>
  </g>
  <!-- Zone 5 -->
  <g transform="translate(16, 324)">
    <text x="12" y="14" font-family="Segoe UI, Arial" font-size="10" font-weight="700" fill="#334155">5</text>
    <g id="btn_z5_en" transform="translate(36, 0)"><rect width="28" height="16" rx="8" fill="#22c55e"/><text x="14" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">ON</text></g>
    <g id="light_z5_color_drum" transform="translate(72, 0)"><rect width="40" height="16" rx="4" fill="#94a3b8"/><text x="20" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">1</text></g>
    <g id="light_z5_sta_lamp" transform="translate(120, 0)"><circle cx="8" cy="8" r="8" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/></g>
    <g id="light_z5_relay" transform="translate(168, 0)"><circle cx="8" cy="8" r="8" fill="#64748b" stroke="#334155" stroke-width="1.5"/></g>
    <g id="btn_apply_z5" transform="translate(224, 0)"><rect width="48" height="16" rx="4" fill="#2563eb"/><text x="24" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">GO</text></g>
  </g>
  <!-- Zone 6 -->
  <g transform="translate(16, 348)">
    <text x="12" y="14" font-family="Segoe UI, Arial" font-size="10" font-weight="700" fill="#334155">6</text>
    <g id="btn_z6_en" transform="translate(36, 0)"><rect width="28" height="16" rx="8" fill="#22c55e"/><text x="14" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">ON</text></g>
    <g id="light_z6_color_drum" transform="translate(72, 0)"><rect width="40" height="16" rx="4" fill="#94a3b8"/><text x="20" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">1</text></g>
    <g id="light_z6_sta_lamp" transform="translate(120, 0)"><circle cx="8" cy="8" r="8" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/></g>
    <g id="light_z6_relay" transform="translate(168, 0)"><circle cx="8" cy="8" r="8" fill="#64748b" stroke="#334155" stroke-width="1.5"/></g>
    <g id="btn_apply_z6" transform="translate(224, 0)"><rect width="48" height="16" rx="4" fill="#2563eb"/><text x="24" y="12" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="700" fill="#fff">GO</text></g>
  </g>

  <text x="160" y="390" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#94a3b8">Click operation / color drums to step</text>
  <text x="160" y="404" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#94a3b8">Color set: brief off-pulses advance fixture wheel</text>

  <!-- Selected zone drum -->
  <g transform="translate(16, 416)">
    <rect x="0" y="0" width="288" height="32" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="72" y="14" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#64748b">EDIT ZONE</text>
    <text id="light_sel_drum" x="72" y="28" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="#0f172a">1</text>
    <text x="216" y="14" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#64748b">PULSE OK</text>
    <g id="light_pulse_perm_lamp" transform="translate(216, 22)">
      <circle cx="0" cy="0" r="8" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
    </g>
  </g>
</svg>
