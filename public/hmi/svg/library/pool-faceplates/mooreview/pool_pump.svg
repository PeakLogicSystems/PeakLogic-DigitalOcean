<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="320" height="300">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="308" height="288" rx="10" fill="url(#panelGrad)" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">FILTER PUMP</text>
  <text x="160" y="44" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">Speed - HOA - Schedule</text>

  <text x="292" y="66" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#334155">FLOW</text>
  <g id="flow_lamp" transform="translate(292, 82)">
    <circle cx="0" cy="0" r="10" fill="#ef4444" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="7" fill="#ef4444" opacity="0.45"/>
  </g>
  <text x="292" y="108" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="600" fill="#64748b">GPM</text>
  <text id="flow_gpm" x="292" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#0f172a">0.0</text>

  <!-- RPM PV / SP -->
  <g transform="translate(16, 56)">
    <rect x="0" y="0" width="288" height="72" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="72" y="18" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="600" fill="#64748b">RPM PV</text>
    <text id="pump_rpm_pv" x="72" y="46" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#0f172a">0</text>

    <text x="200" y="18" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="600" fill="#64748b">RPM SP</text>
    <g id="pump_speed_sp">
      <rect x="158" y="24" width="84" height="28" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <text x="200" y="44" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#0f172a">1800</text>
    </g>
  </g>

  <!-- HOA + run + flow -->
  <g transform="translate(16, 138)">
    <rect x="0" y="0" width="288" height="64" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="56" y="18" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="600" fill="#64748b">PUMP MODE</text>
    <text id="pump_hoa_state" x="56" y="44" text-anchor="middle" font-family="Segoe UI, Arial" font-size="16" font-weight="700" fill="#0f172a">Auto</text>

    <text x="144" y="18" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="600" fill="#64748b">RUN</text>
    <g id="pump_run_lamp" transform="translate(144, 38)">
      <circle cx="0" cy="0" r="14" fill="#64748b" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#64748b" opacity="0.35"/>
    </g>

    <text x="232" y="18" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="600" fill="#64748b">FLOW</text>
    <g id="flow_lamp" transform="translate(232, 38)">
      <circle cx="0" cy="0" r="14" fill="#ef4444" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#ef4444" opacity="0.35"/>
    </g>
  </g>

  <!-- Filter schedule -->
  <g transform="translate(16, 212)">
    <rect x="0" y="0" width="288" height="76" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="144" y="16" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="700" fill="#475569">FILTER SCHEDULE</text>

    <text x="48" y="36" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#64748b">NOW</text>
    <text id="tod_value" x="48" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#0f172a">08:00</text>

    <g id="chk_24hr" transform="translate(88, 38)">
      <rect width="14" height="14" rx="3" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
      <text x="20" y="12" font-family="Segoe UI, Arial" font-size="10" font-weight="700" fill="#0f172a">24 HR</text>
    </g>

    <text x="168" y="36" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="600" fill="#64748b">START</text>
    <g id="window_start">
      <rect x="138" y="40" width="60" height="20" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <text x="168" y="54" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0f172a">08:00</text>
    </g>

    <text x="248" y="36" text-anchor="middle" font-family="Segoe UI, Arial" font-size="8" font-weight="600" fill="#64748b">END</text>
    <g id="window_end">
      <rect x="218" y="40" width="60" height="20" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <text x="248" y="54" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0f172a">20:00</text>
    </g>

    <g id="btn_filter_enable" transform="translate(108, 58)">
      <rect width="56" height="18" rx="4" fill="#22c55e" stroke="#475569" stroke-width="1"/>
      <text x="28" y="13" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="700" fill="#ffffff">ENABLE</text>
    </g>
  </g>
</svg>
