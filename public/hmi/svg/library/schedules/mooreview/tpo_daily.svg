<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="lampGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect id="panel_bg" x="8" y="8" width="464" height="324" rx="10" fill="url(#panelGrad)" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text id="tpo_label" x="240" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">TPO-1 DAILY CYCLE</text>
  <text x="240" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">30 min on, every 2 hr — click values to edit</text>

  <!-- Output status -->
  <text x="52" y="82" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="600" fill="#334155">OUTPUT</text>
  <g id="status_lamp" transform="translate(52, 118)">
    <circle cx="0" cy="0" r="28" fill="#ef4444" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="#ef4444" opacity="0.45"/>
    <circle cx="-7" cy="-8" r="6" fill="#ffffff" opacity="0.35"/>
  </g>
  <text id="run_state" x="52" y="162" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" font-weight="600" fill="#334155">IDLE</text>

  <!-- Schedule readouts -->
  <g id="schedule_panel" transform="translate(240, 142)">
    <rect id="schedule_panel_bg" x="-118" y="-58" width="236" height="116" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="0" y="-38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b">TIME NOW</text>
    <text id="tod_value" x="0" y="-16" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">00:00</text>

    <g id="chk_24hr" transform="translate(-98, -2)">
      <rect width="18" height="18" rx="3" fill="#ffffff" stroke="#475569" stroke-width="2"/>
      <text x="26" y="14" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">24 HOUR</text>
    </g>

    <text x="-58" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#64748b">START</text>
    <g id="window_start">
      <rect x="-88" y="38" width="60" height="20" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <text x="-58" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">06:00</text>
    </g>
    <text x="58" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#64748b">END</text>
    <g id="window_end">
      <rect x="28" y="38" width="60" height="20" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <text x="58" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">08:00</text>
    </g>
    <text x="0" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#64748b">Window used when 24 HOUR is off</text>
  </g>

  <!-- Enable -->
  <text x="430" y="88" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="600" fill="#334155">ENABLE</text>
  <g id="btn_enable" transform="translate(394, 102)">
    <rect width="72" height="28" rx="5" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <text x="36" y="19" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">AUTO</text>
  </g>

  <!-- Online / offline mode (bind fill + text: TPO1_OFFLINE, toggle) -->
  <text x="430" y="148" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" font-weight="600" fill="#334155">MODE</text>
  <g id="btn_offline" transform="translate(394, 158)">
    <rect width="72" height="28" rx="5" fill="#22c55e" stroke="#475569" stroke-width="1.5"/>
    <text id="btn_offline_label" x="36" y="19" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">ONLINE</text>
  </g>

  <!-- Application / repeat parameters (minutes) -->
  <g id="params_panel" transform="translate(240, 268)">
    <rect x="-168" y="-26" width="336" height="64" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#475569">SCHEDULE PARAMETERS</text>
    <text x="-88" y="10" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b">APPLICATION (min)</text>
    <g id="param_app_min">
      <rect x="-128" y="14" width="72" height="24" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <text x="-92" y="31" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">30</text>
    </g>
    <text x="88" y="10" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b">REPEAT BETWEEN (min)</text>
    <g id="param_repeat_min">
      <rect x="48" y="14" width="72" height="24" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
      <text x="84" y="31" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">120</text>
    </g>
  </g>

  <text x="240" y="318" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">Click 24 HOUR, window times, or minute values to set</text>
</svg>
