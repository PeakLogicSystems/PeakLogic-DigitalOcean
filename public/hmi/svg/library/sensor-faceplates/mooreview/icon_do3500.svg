<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="308" height="208" rx="10" fill="url(#panelGrad)" stroke="#0369a1" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0c4a6e">ICON DO3500</text>
  <text x="160" y="44" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#0369a1">Dissolved Oxygen Controller</text>

  <g transform="translate(16, 58)">
    <rect x="0" y="0" width="288" height="72" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
    <text x="144" y="18" text-anchor="middle" font-family="Segoe UI, Arial" font-size="10" font-weight="600" fill="#64748b">DISSOLVED OXYGEN</text>
    <text id="do_pv" x="144" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="28" font-weight="700" fill="#0f172a">0.00</text>
    <text x="144" y="66" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" fill="#64748b">mg/L or %</text>
  </g>

  <g transform="translate(16, 142)">
    <rect x="0" y="0" width="140" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="70" y="16" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#64748b">TEMPERATURE</text>
    <text id="temp_pv" x="70" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#0f172a">0.0</text>

    <rect x="148" y="0" width="140" height="56" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
    <text x="218" y="16" text-anchor="middle" font-family="Segoe UI, Arial" font-size="9" font-weight="600" fill="#64748b">MAIN V</text>
    <text id="main_v" x="218" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#0f172a">0.0</text>
  </g>
