<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/samples/mv-live-api.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opta Double Split HVAC — 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    #canvas-wrap { position: absolute; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .panel { position: absolute; z-index: 10; background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(148, 163, 184, 0.25); border-radius: 10px; backdrop-filter: blur(8px); padding: 14px 16px; font-size: 13px; line-height: 1.45; }
    #title-panel { top: 14px; left: 14px; max-width: 400px; }
    #title-panel h1 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    #title-panel p { color: #94a3b8; font-size: 12px; }
    #controls { top: 14px; right: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 200px; }
    #controls select, #controls button { background: #1e293b; color: #f1f5f9; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
    #legend { bottom: 14px; left: 14px; max-width: 280px; }
    #legend h2 { font-size: 12px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; color: #94a3b8; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 12px; }
    .swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.15); }
    #stats { bottom: 14px; right: 14px; text-align: right; font-size: 12px; color: #94a3b8; max-width: 320px; }
    #stats strong { color: #f1f5f9; display: block; font-size: 13px; margin-bottom: 4px; }
    #mv-status { top: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; padding: 8px 14px; }
    #mv-status.ok { border-color: rgba(34, 197, 94, 0.45); color: #86efac; }
    #mv-status.err { border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; }
    #detail-panel { position: absolute; z-index: 20; right: 14px; bottom: 14px; width: 340px; max-height: 52vh; overflow: auto; display: none; }
    #detail-panel.open { display: block; }
    #detail-panel h2 { font-size: 15px; margin-bottom: 8px; }
    #detail-panel dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 12px; }
    #detail-panel dt { color: #94a3b8; }
    #detail-panel dd { text-align: right; font-family: Consolas, monospace; }
    #detail-panel .alarm-on { color: #f87171; font-weight: 600; }
    #detail-panel .actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
    #hover-tip { position: fixed; z-index: 30; pointer-events: none; display: none; max-width: 300px; padding: 10px 12px; font-size: 12px; background: rgba(15, 23, 42, 0.96); border: 1px solid rgba(148, 163, 184, 0.35); border-radius: 8px; }
    #hover-tip.visible { display: block; }
    .hint { margin-top: 8px; font-size: 11px; color: #64748b; }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="mv-status" class="panel err">MV live: connecting…</div>
  <div id="title-panel" class="panel">
    <h1>Opta Double Split HVAC</h1>
    <p>Dual air handlers + dual outdoor condensers — dual-cond facility preset. Program: <code>opta_double_split_hvac.st</code>.</p>
  </div>
  <div id="controls" class="panel">
    <label>View<select id="view-select"><option value="iso">Oblique</option><option value="top">Top</option><option value="front">Front</option></select></label>
    <button type="button" id="btn-reset">Reset camera</button>
    <p class="hint">Drag orbit · Scroll zoom · Click equipment for live detail</p>
  </div>
  <div id="hover-tip"><strong id="hover-tip-title"></strong><p id="hover-tip-desc"></p></div>
  <div id="detail-panel" class="panel">
    <h2 id="detail-title">Zone</h2>
    <p id="detail-sub" class="hint"></p>
    <dl id="detail-tags"></dl>
    <div class="actions"><button type="button" id="btn-open-hmi">Open in MV HMI</button><button type="button" id="btn-close-detail">Close</button></div>
  </div>
  <div id="legend" class="panel"><h2>Equipment</h2><div id="legend-items"></div></div>
  <div id="stats" class="panel"><strong>System summary</strong>
    <div id="stat-cond1">Condenser 1: —</div>
    <div id="stat-cond2">Condenser 2: —</div>
    <div id="stat-sys">System: —</div>
  </div>
  <script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
  <script type="module">
    const SITE_TYPE = 'double';
    const STAT_TAGS = [{"id":"stat-cond1","tag":"COND1_ALM","label":"Condenser 1"},{"id":"stat-cond2","tag":"COND2_ALM","label":"Condenser 2"},{"id":"stat-sys","tag":"SYS_ALM","label":"System"}];

    const statusEl = document.getElementById('mv-status');
    function setStatus(text, ok) { statusEl.textContent = text; statusEl.className = ok ? 'panel ok' : 'panel err'; }

    const tagValues = new Map();
    let hmiScreenCatalog = new Map();
    let mvPollMs = 60000;
    let mvPollTimer = null;

    async function pollMvLive() {
      const root = String(window.MV_API_BASE || '/api').replace(/\/$/, '');
      try {
        const res = await fetch(`${root}/dashboard`, { credentials: 'same-origin' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        tagValues.clear();
        for (const t of (data.tags || data.tagSnapshot || [])) {
          if (t?.id) tagValues.set(t.id, t.value ?? t.val);
        }
        setStatus(`MV live: ${tagValues.size} tags`, true);
        updateLiveVisuals();
      } catch (e) { setStatus(`MV live: offline (${e.message})`, false); }
    }

    function scheduleMvPoll() {
      if (mvPollTimer) clearInterval(mvPollTimer);
      pollMvLive();
      mvPollTimer = setInterval(pollMvLive, mvPollMs);
    }

    window.addEventListener('message', (e) => {
      if (e.origin !== window.location.origin) return;
      const data = e.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'mv-hmi-poll-config' && Number.isFinite(Number(data.pollMs))) {
        mvPollMs = Math.max(5000, Number(data.pollMs));
        scheduleMvPoll();
      } else if (data.type === 'mv-hmi-screen-catalog' && Array.isArray(data.screens)) {
        hmiScreenCatalog = new Map();
        for (const s of data.screens) {
          if (s?.id) hmiScreenCatalog.set(s.id, s);
        }
      }
    });
    scheduleMvPoll();

    const THREE = await import('three');
    const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
    const { buildHvacSplitSite, applyHvacAlarmGlow, HVAC_COLORS } = await import('./hvac-split-3d.js');

    const LEGEND = [
      ['Building / AHU', HVAC_COLORS.ahu],
      ['Outdoor condenser', HVAC_COLORS.condenser],
      ['Line set', HVAC_COLORS.lineSet],
      ['Opta cabinet', HVAC_COLORS.cabinet],
    ];
    const legendEl = document.getElementById('legend-items');
    for (const [label, hex] of LEGEND) {
      const row = document.createElement('div');
      row.className = 'legend-item';
      row.innerHTML = `<span class="swatch" style="background:#${hex.toString(16).padStart(6, '0')}"></span><span>${label}</span>`;
      legendEl.appendChild(row);
    }

    const wrap = document.getElementById('canvas-wrap');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    const aspect = wrap.clientWidth / wrap.clientHeight;
    const frustum = 18;
    const camera = new THREE.OrthographicCamera(-frustum * aspect, frustum * aspect, frustum, -frustum, 0.1, 200);
    camera.position.set(22, 16, 22);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    wrap.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1, 0);
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const sun = new THREE.DirectionalLight(0xffffff, 0.85);
    sun.position.set(12, 24, 10);
    scene.add(sun);

    const { group, pickables } = buildHvacSplitSite(THREE, SITE_TYPE, { scale: 1.1 });
    scene.add(group);

    const hoverMeshes = [];
    for (const p of pickables) {
      p.mesh.userData.zone = true;
      p.mesh.userData.label = p.label;
      p.mesh.userData.description = p.description;
      p.mesh.userData.alarmTag = p.alarmTag;
      p.mesh.userData.detailScreen = p.detailScreen;
      p.mesh.userData.detailTags = p.tags;
      p.mesh.traverse((o) => { if (o.isMesh) hoverMeshes.push(o); });
    }

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let selectedZone = null;

    function applyView(mode) {
      const dist = 32;
      if (mode === 'top') { camera.position.set(0, dist, 0.01); controls.target.set(0, 0, 0); }
      else if (mode === 'front') { camera.position.set(0, 10, dist); controls.target.set(0, 1, 0); }
      else { camera.position.set(22, 16, 22); controls.target.set(0, 1, 0); }
      controls.update();
    }
    document.getElementById('view-select').addEventListener('change', (e) => applyView(e.target.value));
    document.getElementById('btn-reset').addEventListener('click', () => { document.getElementById('view-select').value = 'iso'; applyView('iso'); });

    function formatTagValue(tagId, raw) {
      if (raw == null) return '—';
      if (typeof raw === 'boolean') return raw ? 'ALM' : 'OK';
      if (typeof raw === 'number') return tagId.includes('TEMP') ? raw.toFixed(0) : raw.toFixed(1);
      return String(raw);
    }

    function updateLiveVisuals() {
      for (const { id, tag, label } of STAT_TAGS) {
        const v = tagValues.get(tag);
        const on = v === true || v === 1;
        document.getElementById(id).textContent = `${label}: ${on ? 'ALARM' : 'OK'}`;
      }
      applyHvacAlarmGlow(pickables, (tagId) => {
        const v = tagValues.get(tagId);
        return v === true || v === 1;
      });
      if (selectedZone) updateDetailPanelValues(selectedZone);
    }

    function updateDetailPanelValues(mesh) {
      const dl = document.getElementById('detail-tags');
      dl.innerHTML = '';
      for (const [label, tagId] of mesh.userData.detailTags || []) {
        const dt = document.createElement('dt'); dt.textContent = label;
        const dd = document.createElement('dd');
        const val = tagValues.get(tagId);
        dd.textContent = formatTagValue(tagId, val);
        if ((tagId.endsWith('_FLT') || tagId.endsWith('_LEAK') || tagId.endsWith('_ALM')) && (val === true || val === 1)) dd.className = 'alarm-on';
        dl.appendChild(dt); dl.appendChild(dd);
      }
    }

    function renderDetailPanel(mesh) {
      selectedZone = mesh;
      document.getElementById('detail-title').textContent = mesh.userData.label || 'Zone';
      document.getElementById('detail-sub').textContent = mesh.userData.description || '';
      updateDetailPanelValues(mesh);
      document.getElementById('detail-panel').classList.add('open');
      document.getElementById('btn-open-hmi').dataset.screen = mesh.userData.detailScreen || 'screen_2';
    }

    document.getElementById('btn-close-detail').addEventListener('click', () => {
      document.getElementById('detail-panel').classList.remove('open');
      selectedZone = null;
    });
    document.getElementById('btn-open-hmi').addEventListener('click', (e) => {
      const screenId = e.target.dataset.screen || 'screen_2';
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'mv-hmi-open-area', screenId, label: selectedZone?.userData?.label || '' }, window.location.origin);
      }
    });

    renderer.domElement.addEventListener('click', (ev) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(hoverMeshes, false);
      if (!hits.length) return;
      let mesh = hits[0].object;
      while (mesh && !mesh.userData.zone) mesh = mesh.parent;
      if (mesh?.userData?.zone) renderDetailPanel(mesh);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const a = wrap.clientWidth / wrap.clientHeight;
      camera.left = -frustum * a; camera.right = frustum * a;
      camera.updateProjectionMatrix();
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    });
  </script>
</body>
</html>
